<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saltline Brawl — demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d14; color: #c9d1e4; font-family: ui-monospace, Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  canvas { width: min(96vw, calc((100vh - 60px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; border: 2px solid #232a3d; border-radius: 4px; }
  p { margin: 0; font-size: 13px; opacity: .75; text-align: center; }
  kbd { background: #1c2233; border: 1px solid #36405c; border-radius: 3px; padding: 0 5px; }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<p><kbd>←↑↓→</kbd>/<kbd>WASD</kbd> move · <kbd>J</kbd>/<kbd>Z</kbd> attack · <kbd>K</kbd>/<kbd>X</kbd> jump · <kbd>L</kbd>/<kbd>C</kbd> special · <kbd>P</kbd> pause · <kbd>Enter</kbd> start</p>
<script src="src/ai.js"></script>
<script src="src/game.js"></script>
</body>
</html>
